<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Мой день</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff;--fg:#15171A;--muted:#6b6f76;--line:#E4E5E8;--card:#F5F5F6;
  --accent:#EA580C;--hot:#9a3412;--box:#A9ACB2;--input:#D5D7DB;
}
[data-theme="dark"]{
  --bg:#121316;--fg:#EDEEF0;--muted:#9A9EA6;--line:#2A2C31;--card:#1C1E22;
  --accent:#FB7A3C;--hot:#FDBA74;--box:#5A5E66;--input:#34373D;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:Onest,system-ui,-apple-system,sans-serif;transition:background-color .2s,color .2s}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:left}
input{font:inherit;color:inherit;background:none;border:0;outline:none;min-width:0}
input::placeholder{color:var(--muted)}
svg{display:block}

.app{max-width:520px;margin:0 auto;min-height:100vh;padding:24px 22px calc(160px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:22px}

header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.sub{font-size:14px;color:var(--muted)}
h1{margin:4px 0 0;font-size:30px;font-weight:700;letter-spacing:-.01em}
.back{font-size:14px;font-weight:600;color:var(--accent);min-height:32px;margin-bottom:4px}
.icon-btn{width:44px;height:44px;flex:none;border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--muted);border:1.5px solid var(--line)}

/* лента */
.tl{display:flex;flex-direction:column}
.row{display:flex;align-items:stretch;gap:12px;width:100%;user-select:none;-webkit-user-select:none}
.row .time{width:46px;flex:none;padding-top:16px;font-size:14px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.rail{width:16px;flex:none;display:flex;flex-direction:column;align-items:center}
.rail .l1{width:2px;height:18px;background:var(--line)}
.rail .l2{width:2px;flex:1;background:var(--line)}
.dot{width:14px;height:14px;flex:none;border-radius:50%;border:2.5px solid var(--accent);background:var(--bg)}
.row.done .dot{background:var(--accent)}
.row .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;padding:13px 0 18px}
.row .title{font-size:17px;font-weight:600;overflow-wrap:anywhere}
.tag{font-size:13px;font-weight:600;color:var(--hot)}
.done .title{font-weight:500;color:var(--muted);text-decoration:line-through}

.now{display:flex;align-items:center;gap:12px;height:18px}
.now .t{width:46px;flex:none;font-size:12px;font-weight:600;color:var(--accent);font-variant-numeric:tabular-nums}
.now .r{width:16px;flex:none;display:flex;justify-content:center}
.now .d{width:8px;height:8px;border-radius:50%;background:var(--accent)}
.now .l{flex:1;height:2px;border-radius:2px;background:var(--accent);opacity:.45}

/* карточки */
.card{display:flex;flex-direction:column;gap:2px;padding:12px 16px;border-radius:16px;background:var(--card)}
.card h2{margin:2px 0 4px;font-size:13px;font-weight:600;color:var(--muted)}
.item{display:flex;align-items:center;gap:12px;min-height:44px;width:100%;user-select:none;-webkit-user-select:none}
.box{width:20px;height:20px;flex:none;border-radius:6px;border:2px solid var(--box);display:flex;align-items:center;justify-content:center;color:#fff}
.item.done .box{background:var(--accent);border-color:var(--accent)}
.item .title{flex:1;min-width:0;font-size:16px;font-weight:500;overflow-wrap:anywhere}
.right{font-size:13px;color:var(--muted);flex:none;font-variant-numeric:tabular-nums}
.hotdot{width:8px;height:8px;flex:none;border-radius:50%;background:var(--accent)}

.nav{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px;padding:0 4px;border-top:1px solid var(--line);font-size:15px;font-weight:600;width:100%}
.nav + .nav{border-top:0}
.muted{color:var(--muted);font-weight:500}
.empty{padding:28px 4px;color:var(--muted);font-size:15px;line-height:1.5}

/* ввод */
.bar{position:fixed;left:0;right:0;bottom:0;padding:8px 22px calc(14px + env(safe-area-inset-bottom));background:var(--bg);transition:background-color .2s}
.hint{max-width:476px;margin:0 auto 6px;font-size:13px;font-weight:500;color:var(--muted)}
.hint:empty{display:none}
.field{max-width:476px;margin:0 auto;display:flex;align-items:center;gap:10px;height:52px;padding:0 6px 0 16px;border-radius:14px;border:1.5px solid var(--input);background:var(--bg)}
.field:focus-within{border-color:var(--accent)}
.field input{flex:1;font-size:16px;height:100%}
#go{width:40px;height:40px;flex:none;border-radius:10px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;opacity:.35;transition:opacity .15s}
#go.on{opacity:1}

.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translate(-50%,10px);padding:10px 14px;border-radius:12px;background:var(--fg);color:var(--bg);font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast{display:flex;align-items:center;gap:14px}
/* напоминания */
.wrap{display:flex;align-items:flex-start;gap:4px;width:100%}
.wrap > .row,.wrap > .item{flex:1;min-width:0;width:auto}
.wrap > .item + .bell{align-self:center}
.bell{width:44px;height:44px;flex:none;border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--box)}
.row + .bell{margin-top:4px}
.bell.on{color:var(--accent)}
.tags{display:flex;flex-wrap:wrap;gap:4px 10px}
.rtag{font-size:13px;font-weight:500;color:var(--muted)}
.chips{max-width:476px;margin:0 auto 8px;display:flex;align-items:center;gap:8px}
.chips[hidden]{display:none}
.chips-l{font-size:13px;color:var(--muted)}
.chip{height:32px;padding:0 12px;border-radius:999px;border:1.5px solid var(--input);font-size:13px;font-weight:600;color:var(--muted)}
.chip[aria-pressed="true"]{border-color:var(--accent);color:var(--hot)}
.sheet{position:fixed;inset:0;z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.4)}
.panel{position:relative;width:100%;max-width:520px;background:var(--bg);border-radius:20px 20px 0 0;padding:22px 22px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:6px}
.panel h3{margin:0;font-size:20px;font-weight:700}
.sheet-task{margin:0 0 8px;font-size:15px;color:var(--muted)}
.opt{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px;border-bottom:1px solid var(--line);font-size:16px;font-weight:500;cursor:pointer}
.opt.off{color:var(--muted);cursor:default}
.sw{appearance:none;-webkit-appearance:none;width:46px;height:28px;border-radius:14px;background:var(--line);position:relative;flex:none;margin:0;cursor:pointer;transition:background-color .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:left .15s}
.sw:checked{background:var(--accent)}
.sw:checked::after{left:21px}
.sw:disabled{opacity:.4;cursor:default}
.note{margin:6px 0 4px;font-size:13px;line-height:1.45;color:var(--muted)}
.note:empty{display:none}
.primary{height:50px;margin-top:8px;border-radius:14px;background:var(--fg);color:var(--bg);font-size:16px;font-weight:600;text-align:center}
.toast-act{color:inherit;font-weight:700;text-decoration:underline;text-underline-offset:3px;min-height:28px}
</style>
</head>
<body>
<main id="app" class="app"></main>

<form id="add" class="bar" autocomplete="off">
  <div id="hint" class="hint" aria-live="polite"></div>
  <div id="chips" class="chips" hidden>
    <span class="chips-l">Напомнить:</span>
    <button type="button" class="chip" data-m="60" aria-pressed="false">за 1 час</button>
    <button type="button" class="chip" data-m="15" aria-pressed="false">за 15 мин</button>
  </div>
  <label class="field">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="color:var(--muted)"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
    <input id="inp" type="text" enterkeyhint="done" aria-label="Новая задача" placeholder="«завтра в 9 созвон !»">
    <button id="go" type="button" aria-label="Добавить задачу">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
    </button>
  </label>
</form>
<div id="toast" class="toast" role="status"></div>

<div id="sheet" class="sheet" hidden>
  <div class="scrim" data-close></div>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <h3 id="sheetTitle">Напоминание</h3>
    <p id="sheetTask" class="sheet-task"></p>
    <label class="opt" id="o60"><span>За 1 час</span><input type="checkbox" class="sw" id="r60"></label>
    <label class="opt" id="o15"><span>За 15 минут</span><input type="checkbox" class="sw" id="r15"></label>
    <p id="sheetNote" class="note"></p>
    <button type="button" class="primary" data-close>Готово</button>
  </div>
</div>

<script>
(() => {
'use strict';

/* ====== НАСТРОЙКА ======
   Адрес сервера напоминаний (Cloudflare Worker), например:
   const REMIND_API = 'https://my-day-reminders.твой-ник.workers.dev';
   Пока пусто — напоминания можно выставлять, но отправляться они не будут. */
const REMIND_API = 'https://my-day-reminders.fuckzenith.workers.dev';

/* ---------- Telegram ---------- */
const tg = window.Telegram && window.Telegram.WebApp;
const inTg = !!(tg && tg.initData);
const ver = v => { try { return !!(tg && tg.isVersionAtLeast(v)); } catch (_) { return false; } };
const cloud = inTg && ver('6.9') && tg.CloudStorage ? tg.CloudStorage : null;

if (tg) {
  try { tg.ready(); tg.expand(); } catch (_) {}
  if (ver('7.7')) { try { tg.disableVerticalSwipes(); } catch (_) {} }
}
const haptic = (kind) => {
  if (!inTg || !ver('6.1')) return;
  try { kind === 'success' ? tg.HapticFeedback.notificationOccurred('success') : tg.HapticFeedback.impactOccurred(kind || 'light'); } catch (_) {}
};

/* ---------- даты ---------- */
const WD = ['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];
const WD_S = ['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
const MON = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const pad = n => String(n).padStart(2, '0');
const key = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const fromKey = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const midnight = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
const todayKey = () => key(new Date());
const tomorrowKey = () => key(addDays(new Date(), 1));
const nowHM = () => { const d = new Date(); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const cap = s => s ? s[0].toUpperCase() + s.slice(1) : s;
function dayTitle(k) {
  if (k === todayKey()) return 'Сегодня';
  if (k === tomorrowKey()) return 'Завтра';
  if (k === key(addDays(new Date(), -1))) return 'Вчера';
  const d = fromKey(k);
  return WD_S[d.getDay()] + ', ' + d.getDate() + ' ' + MON[d.getMonth()];
}
const longDate = k => { const d = fromKey(k); return cap(WD[d.getDay()]) + ', ' + d.getDate() + ' ' + MON[d.getMonth()]; };
function plural(n, a, b, c) {
  const m10 = n % 10, m100 = n % 100;
  if (m10 === 1 && m100 !== 11) return a;
  if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return b;
  return c;
}

/* ---------- разбор «завтра в 9 созвон !» ---------- */
const WD_MAP = {'воскресенье':0,'вс':0,'понедельник':1,'пн':1,'вторник':2,'вт':2,'среду':3,'среда':3,'ср':3,'четверг':4,'чт':4,'пятницу':5,'пятница':5,'пт':5,'субботу':6,'суббота':6,'сб':6};
function parse(raw) {
  let s = ' ' + raw.replace(/\s+/g, ' ') + ' ';
  let date = null, time = '', hot = false;
  const base = midnight();
  const take = (re, fn) => { const m = s.match(re); if (m && fn(m) !== false) s = s.replace(re, ' '); };
  const setTime = (h, m) => { h = +h; m = +(m || 0); if (h > 23 || m > 59) return false; time = pad(h) + ':' + pad(m); };

  if (/!/.test(s)) { hot = true; s = s.replace(/!+/g, ' '); }
  take(/\sпослезавтра\s/i, () => { date = addDays(base, 2); });
  take(/\sзавтра\s/i, () => { date = addDays(base, 1); });
  take(/\sсегодня\s/i, () => { date = new Date(base); });
  take(/\sчерез\s+(\d{1,3})\s+(?:день|дня|дней)\s/i, m => { date = addDays(base, +m[1]); });
  take(/\sчерез\s+неделю\s/i, () => { date = addDays(base, 7); });
  take(new RegExp('\\s(\\d{1,2})\\s+(' + MON.join('|') + ')\\s', 'i'), m => {
    const d = new Date(base.getFullYear(), MON.indexOf(m[2].toLowerCase()), +m[1]);
    if (d < base) d.setFullYear(d.getFullYear() + 1);
    date = d;
  });
  take(/\s(?:во?\s+)?(понедельник|вторник|среду|среда|четверг|пятницу|пятница|субботу|суббота|воскресенье|пн|вт|ср|чт|пт|сб|вс)\s/i, m => {
    const wd = WD_MAP[m[1].toLowerCase()];
    date = addDays(base, ((wd - base.getDay() + 7) % 7) || 7);
  });
  take(/\s(?:в|к|до)\s+(\d{1,2})(?:[:.](\d{2}))?(?:\s*(?:ч|час|часа|часов))?\s/i, m => setTime(m[1], m[2]));
  if (!time) take(/\s(\d{1,2}):(\d{2})\s/, m => setTime(m[1], m[2]));
  take(/\s(\d{1,2})\.(\d{1,2})(?:\.(\d{2,4}))?\s/, m => {
    const dd = +m[1], mm = +m[2];
    if (dd < 1 || dd > 31 || mm < 1 || mm > 12) return false;
    let y = m[3] ? +m[3] : base.getFullYear(); if (y < 100) y += 2000;
    const d = new Date(y, mm - 1, dd);
    if (!m[3] && d < base) d.setFullYear(d.getFullYear() + 1);
    date = d;
  });
  take(/\sутром\s/i, () => { if (!time) time = '09:00'; });
  take(/\s(?:днём|днем)\s/i, () => { if (!time) time = '13:00'; });
  take(/\sвечером\s/i, () => { if (!time) time = '19:00'; });

  if (!date) date = (time && time <= nowHM()) ? addDays(base, 1) : new Date(base);
  let t = s.replace(/\s+/g, ' ').replace(/^[\s,.\-—:]+|[\s,\-—:]+$/g, '').trim();
  return { t: cap(t), date: key(date), time, hot };
}

/* ---------- хранилище ---------- */
let tasks = [];
let theme = 'light';
let prevChunks = 0;
const cGet = keys => new Promise(r => { try { cloud.getItems(keys, (e, v) => r(e ? null : v)); } catch (_) { r(null); } });
const cSet = (k, v) => new Promise(r => { try { cloud.setItem(k, v, e => r(!e)); } catch (_) { r(false); } });
const cDel = keys => new Promise(r => { try { cloud.removeItems(keys, () => r()); } catch (_) { r(); } });

async function load() {
  let local = null;
  try { local = JSON.parse(localStorage.getItem('tasks')); } catch (_) {}
  let saved = null;
  try { saved = localStorage.getItem('theme'); } catch (_) {}
  if (cloud) {
    const meta = await cGet(['n', 'theme']);
    if (meta) {
      if (meta.theme) saved = meta.theme;
      const n = +meta.n || 0;
      if (n) {
        const ks = Array.from({ length: n }, (_, i) => 'c' + i);
        const v = await cGet(ks);
        if (v) {
          try { const arr = JSON.parse(ks.map(k => v[k] || '').join('')); prevChunks = n; return { list: arr, theme: saved }; } catch (_) {}
        }
      }
    }
  }
  return { list: Array.isArray(local) ? local : [], theme: saved };
}

let saveTimer = null;
function save() {
  try { localStorage.setItem('tasks', JSON.stringify(tasks)); } catch (_) {}
  clearTimeout(saveTimer);
  saveTimer = setTimeout(pushCloud, 400);
  scheduleSync();
}

/* ---------- напоминания ---------- */
const taskAt = x => { const d = fromKey(x.date); const [hh, mm] = x.time.split(':').map(Number); d.setHours(hh, mm, 0, 0); return d.getTime(); };
const remindable = x => !!x.time && !x.done && taskAt(x) > Date.now();
const hasRemind = x => Array.isArray(x.remind) && x.remind.length > 0;
function remindLabel(x) {
  if (!hasRemind(x)) return '';
  const r = [...x.remind].sort((a, b) => b - a);
  return 'напомню за ' + r.map(m => m === 60 ? '1 ч' : m + ' мин').join(' и ');
}
let syncTimer = null, syncError = '';
function scheduleSync() {
  if (!REMIND_API || !inTg) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(syncReminders, 800);
}
async function syncReminders() {
  const now = Date.now(), list = [];
  for (const x of tasks) {
    if (x.done || !x.time || !hasRemind(x)) continue;
    const at0 = taskAt(x);
    for (const m of x.remind) {
      const at = at0 - m * 60000;
      if (at > now) list.push({
        k: x.id + ':' + m + ':' + at, at,
        text: (m === 60 ? 'Через час' : 'Через 15 минут') + ': ' + x.t + ' (' + x.time + ')' + (x.hot ? ' — важно' : '')
      });
    }
  }
  try {
    const r = await fetch(REMIND_API.replace(/\/+$/, '') + '/sync', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Init-Data': tg.initData },
      body: JSON.stringify({ reminders: list })
    });
    syncError = r.ok ? '' : (r.status === 403 ? 'сервер не узнал тебя — проверь OWNER_ID и BOT_TOKEN' : 'ошибка ' + r.status);
  } catch (_) {
    syncError = 'нет связи с сервером';
  }
}
async function pushCloud() {
  if (!cloud) return;
  const s = JSON.stringify(tasks);
  const parts = [];
  for (let i = 0; i < s.length; i += 3800) parts.push(s.slice(i, i + 3800));
  if (!parts.length) parts.push('[]');
  for (let i = 0; i < parts.length; i++) await cSet('c' + i, parts[i]);
  await cSet('n', String(parts.length));
  if (prevChunks > parts.length) await cDel(Array.from({ length: prevChunks - parts.length }, (_, i) => 'c' + (parts.length + i)));
  prevChunks = parts.length;
}
function cleanup() {
  const limit = key(addDays(new Date(), -14));
  tasks = tasks.filter(x => !(x.done && x.date < limit));
}

/* ---------- тема ---------- */
const BG = { light: '#ffffff', dark: '#121316' };
function applyTheme(th) {
  theme = th === 'dark' ? 'dark' : 'light';
  document.documentElement.dataset.theme = theme;
  if (inTg) {
    try { if (ver('6.1')) { tg.setHeaderColor(BG[theme]); tg.setBackgroundColor(BG[theme]); } } catch (_) {}
    try { if (ver('7.10')) tg.setBottomBarColor(BG[theme]); } catch (_) {}
  }
}
function toggleTheme() {
  applyTheme(theme === 'dark' ? 'light' : 'dark');
  try { localStorage.setItem('theme', theme); } catch (_) {}
  if (cloud) cSet('theme', theme);
  haptic('light');
  render();
}
function systemTheme() {
  if (inTg && tg.colorScheme) return tg.colorScheme;
  return window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
}

/* ---------- DOM ---------- */
const $ = s => document.querySelector(s);
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  for (const k in (props || {})) {
    const v = props[k];
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v);
  }
  for (const c of kids) { if (c == null || c === false) continue; el.append(c instanceof Node ? c : String(c)); }
  return el;
}
const svg = markup => { const s = document.createElement('span'); s.innerHTML = markup; return s.firstChild; };
const ICON = {
  moon: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>',
  sun: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  check: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg>',
  bell: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>',
  bellOff: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8.7 3A6 6 0 0 1 18 8c0 2.7.4 4.6 1 6"/><path d="M17 17H3s3-2 3-9c0-.8.1-1.5.4-2.2"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/><path d="M2 2l20 20"/></svg>',
  chev: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>'
};

/* ---------- действия ---------- */
function toggle(x) {
  x.done = !x.done;
  haptic(x.done ? 'success' : 'light');
  save(); render();
}
function remove(x) {
  tasks = tasks.filter(t => t.id !== x.id);
  haptic('medium'); save(); render();
}
function askRemove(x) {
  const msg = 'Удалить «' + x.t + '»?';
  if (inTg && ver('6.2')) { try { tg.showConfirm(msg, ok => { if (ok) remove(x); }); return; } catch (_) {} }
  // вне Telegram диалоги могут быть заблокированы — удаляем сразу, с возможностью отмены
  const idx = tasks.indexOf(x);
  remove(x);
  toast('Удалено', 'Вернуть', () => { tasks.splice(Math.min(idx, tasks.length), 0, x); save(); render(); });
}
function bind(el, x) {
  let timer = null, long = false;
  const stop = () => { clearTimeout(timer); timer = null; };
  el.addEventListener('pointerdown', () => { long = false; timer = setTimeout(() => { long = true; askRemove(x); }, 550); });
  el.addEventListener('pointerup', stop);
  el.addEventListener('pointerleave', stop);
  el.addEventListener('pointercancel', stop);
  el.addEventListener('contextmenu', e => { e.preventDefault(); stop(); if (!long) { long = true; askRemove(x); } });
  el.addEventListener('click', () => { if (long) { long = false; return; } toggle(x); });
  return el;
}

/* ---------- экраны ---------- */
let view = { kind: 'day', date: todayKey() };
const goHome = () => { view = { kind: 'day', date: todayKey() }; render(); window.scrollTo(0, 0); };
const go = v => { view = v; haptic('light'); render(); window.scrollTo(0, 0); };
if (tg && tg.BackButton) { try { tg.BackButton.onClick(goHome); } catch (_) {} }

function header(title, sub, back) {
  const left = h('div', {},
    back ? h('button', { class: 'back', type: 'button', onclick: goHome }, '← Сегодня') : null,
    h('div', { class: 'sub' }, sub),
    h('h1', {}, title));
  const tb = h('button', { class: 'icon-btn', type: 'button', 'aria-label': theme === 'dark' ? 'Светлая тема' : 'Тёмная тема', onclick: toggleTheme },
    svg(theme === 'dark' ? ICON.sun : ICON.moon));
  return h('header', {}, left, tb);
}
function timedRow(x) {
  const b = h('button', { type: 'button', class: 'row' + (x.done ? ' done' : ''), 'aria-pressed': String(x.done) },
    h('span', { class: 'time' }, x.time),
    h('span', { class: 'rail', 'aria-hidden': 'true' }, h('span', { class: 'l1' }), h('span', { class: 'dot' }), h('span', { class: 'l2' })),
    h('span', { class: 'body' },
      h('span', { class: 'title' }, x.t),
      (x.hot || hasRemind(x)) && !x.done ? h('span', { class: 'tags' },
        x.hot ? h('span', { class: 'tag' }, 'Важно') : null,
        hasRemind(x) && remindable(x) ? h('span', { class: 'rtag' }, remindLabel(x)) : null) : null));
  return withBell(bind(b, x), x);
}
function bellBtn(x) {
  const on = hasRemind(x);
  return h('button', { type: 'button', class: 'bell' + (on ? ' on' : ''), 'aria-label': on ? 'Напоминание: ' + remindLabel(x) : 'Добавить напоминание', onclick: () => openSheet(x) },
    svg(on ? ICON.bell : ICON.bellOff));
}
function withBell(btn, x) {
  if (!remindable(x)) return btn;
  return h('div', { class: 'wrap' }, btn, bellBtn(x));
}
function nowRow(n) {
  return h('div', { class: 'now', 'aria-hidden': 'true' },
    h('span', { class: 't' }, n), h('span', { class: 'r' }, h('span', { class: 'd' })), h('span', { class: 'l' }));
}
function itemRow(x, right) {
  const b = h('button', { type: 'button', class: 'item' + (x.done ? ' done' : ''), 'aria-pressed': String(x.done) },
    h('span', { class: 'box' }, x.done ? svg(ICON.check) : null),
    h('span', { class: 'title' }, x.t),
    x.hot && !x.done ? h('span', { class: 'hotdot', role: 'img', 'aria-label': 'важно' }) : null,
    right ? h('span', { class: 'right' }, right) : null);
  return withBell(bind(b, x), x);
}

/* ---------- окно напоминания ---------- */
let sheetTask = null;
const sheet = $('#sheet'), r60 = $('#r60'), r15 = $('#r15');
function openSheet(x) {
  sheetTask = x;
  $('#sheetTask').textContent = x.t + ' · ' + dayTitle(x.date).toLowerCase() + ', ' + x.time;
  const at = taskAt(x), now = Date.now(), rem = x.remind || [];
  for (const [el, opt, m] of [[r60, $('#o60'), 60], [r15, $('#o15'), 15]]) {
    const past = at - m * 60000 <= now;
    el.checked = rem.includes(m) && !past;
    el.disabled = past;
    opt.classList.toggle('off', past);
  }
  let note = '';
  if (!REMIND_API) {
    note = 'Сервер напоминаний ещё не подключён — настройку сохраню, но сообщения пока не придут.';
    if (inTg && tg.initDataUnsafe && tg.initDataUnsafe.user) note += ' Твой Telegram ID для настройки: ' + tg.initDataUnsafe.user.id + '.';
  } else if (!inTg) {
    note = 'Напоминания отправляются, только когда приложение открыто из Telegram.';
  } else if (syncError) {
    note = 'Не получилось отправить на сервер: ' + syncError + '.';
  }
  $('#sheetNote').textContent = note;
  sheet.hidden = false;
  haptic('light');
  (r60.disabled ? r15 : r60).focus({ preventScroll: true });
}
function closeSheet() { sheet.hidden = true; sheetTask = null; }
function sheetChanged() {
  if (!sheetTask) return;
  const r = [];
  if (r60.checked) r.push(60);
  if (r15.checked) r.push(15);
  sheetTask.remind = r;
  save(); render(); haptic('light');
}
r60.addEventListener('change', sheetChanged);
r15.addEventListener('change', sheetChanged);
sheet.querySelectorAll('[data-close]').forEach(el => el.addEventListener('click', closeSheet));
sheet.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });
function card(title, items, rightFn) {
  return h('section', { class: 'card' }, h('h2', {}, title), ...items.map(x => itemRow(x, rightFn ? rightFn(x) : '')));
}
function navRow(label, sub, onclick) {
  return h('button', { type: 'button', class: 'nav', onclick },
    h('span', {}, label, sub ? h('span', { class: 'muted' }, ' · ' + sub) : null), svg(ICON.chev));
}
const byTime = (a, b) => (a.time || '99').localeCompare(b.time || '99');
const anyOrder = (a, b) => (a.done - b.done) || (b.hot - a.hot) || ((a.created || 0) - (b.created || 0));
const countLabel = n => n + ' ' + plural(n, 'задача', 'задачи', 'задач');

function renderDay(app, k) {
  const t = todayKey(), isToday = k === t;
  app.append(header(isToday ? 'Мой день' : dayTitle(k), longDate(k), !isToday));

  const over = isToday ? tasks.filter(x => !x.done && x.date < t).sort((a, b) => a.date.localeCompare(b.date) || byTime(a, b)) : [];
  const list = tasks.filter(x => x.date === k);
  const timed = list.filter(x => x.time).sort(byTime);
  const any = list.filter(x => !x.time).sort(anyOrder);

  if (over.length) app.append(card('Перенесено', over, x => dayTitle(x.date).toLowerCase() + (x.time ? ' ' + x.time : '')));

  if (timed.length) {
    const tl = h('section', { class: 'tl', 'aria-label': 'По времени' });
    const n = nowHM();
    let placed = !isToday;
    for (const x of timed) {
      if (!placed && x.time > n) { tl.append(nowRow(n)); placed = true; }
      tl.append(timedRow(x));
    }
    if (!placed) tl.append(nowRow(n));
    app.append(tl);
  }
  if (any.length) app.append(card('В любое время', any));

  if (!list.length && !over.length) {
    app.append(h('p', { class: 'empty' }, isToday
      ? 'На сегодня пусто. Напиши задачу внизу — дату и время пойму сам: «завтра в 9 созвон», «в пятницу отчёт !».'
      : 'Ничего не запланировано.'));
  }

  if (isToday) {
    const tk = tomorrowKey();
    const tmr = tasks.filter(x => x.date === tk && !x.done);
    const first = tmr.filter(x => x.time).sort(byTime)[0];
    app.append(navRow('Завтра', tmr.length ? countLabel(tmr.length) + (first ? ', первая в ' + first.time : '') : 'пусто',
      () => go({ kind: 'day', date: tk })));
    const later = tasks.filter(x => x.date > tk && !x.done);
    if (later.length) app.append(navRow('Позже', countLabel(later.length), () => go({ kind: 'later' })));
  }
}

function renderLater(app) {
  const tk = tomorrowKey();
  app.append(header('Позже', 'Всё, что дальше завтрашнего дня', true));
  const list = tasks.filter(x => x.date > tk).sort((a, b) => a.date.localeCompare(b.date) || byTime(a, b));
  if (!list.length) { app.append(h('p', { class: 'empty' }, 'Здесь пусто.')); return; }
  const groups = {};
  for (const x of list) (groups[x.date] = groups[x.date] || []).push(x);
  for (const d of Object.keys(groups)) app.append(card(dayTitle(d), groups[d], x => x.time));
}

function render() {
  const app = $('#app');
  app.replaceChildren();
  if (view.kind === 'later') renderLater(app); else renderDay(app, view.date);
  const home = view.kind === 'day' && view.date === todayKey();
  if (inTg && ver('6.1')) { try { home ? tg.BackButton.hide() : tg.BackButton.show(); } catch (_) {} }
}

/* ---------- ввод ---------- */
const inp = $('#inp'), hint = $('#hint'), goBtn = $('#go');
let toastTimer = null;
function toast(msg, actionLabel, action) {
  const el = $('#toast');
  el.replaceChildren(h('span', {}, msg));
  if (actionLabel) {
    el.append(h('button', { type: 'button', class: 'toast-act', onclick: () => { el.classList.remove('show'); action(); } }, actionLabel));
  }
  el.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), actionLabel ? 4000 : 1800);
}
const chips = $('#chips');
let draftRemind = (() => { try { const v = JSON.parse(localStorage.getItem('remindDefault')); return Array.isArray(v) ? v : []; } catch (_) { return []; } })();
function paintChips() {
  chips.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', String(draftRemind.includes(+c.dataset.m))));
}
chips.querySelectorAll('.chip').forEach(c => {
  c.addEventListener('pointerdown', e => e.preventDefault()); // не закрывать клавиатуру
  c.addEventListener('click', () => {
    const m = +c.dataset.m;
    draftRemind = draftRemind.includes(m) ? draftRemind.filter(x => x !== m) : draftRemind.concat(m);
    try { localStorage.setItem('remindDefault', JSON.stringify(draftRemind)); } catch (_) {}
    paintChips(); haptic('light');
  });
});
paintChips();
function updateHint() {
  const v = inp.value.trim();
  goBtn.classList.toggle('on', !!v);
  if (!v) { hint.textContent = ''; chips.hidden = true; return; }
  const p = parse(v);
  hint.textContent = '→ ' + dayTitle(p.date) + (p.time ? ', ' + p.time : '') + (p.hot ? ' · важно' : '');
  chips.hidden = !p.time;
}
inp.addEventListener('input', updateHint);
// Не полагаемся на отправку формы: в некоторых просмотрщиках она заблокирована
$('#add').addEventListener('submit', e => { e.preventDefault(); addTask(); });
goBtn.addEventListener('click', e => { e.preventDefault(); addTask(); inp.focus(); });
inp.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); addTask(); }
});
function addTask() {
  const v = inp.value.trim();
  if (!v) return;
  const p = parse(v);
  if (!p.t) return;
  const x = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), t: p.t, date: p.date, time: p.time, hot: p.hot, done: false, created: Date.now(), remind: [] };
  if (x.time) { const at = taskAt(x), now = Date.now(); x.remind = draftRemind.filter(m => at - m * 60000 > now); }
  tasks.push(x);
  inp.value = ''; updateHint();
  haptic('light'); save(); render();
  const shown = (view.kind === 'day' && view.date === p.date) || (view.kind === 'later' && p.date > tomorrowKey());
  if (!shown) toast('Добавлено: ' + dayTitle(p.date).toLowerCase() + (p.time ? ', ' + p.time : ''));
}

/* ---------- старт ---------- */
applyTheme((() => { try { return localStorage.getItem('theme'); } catch (_) { return null; } })() || systemTheme());
render();
load().then(({ list, theme: th }) => {
  tasks = list; cleanup();
  if (th === 'light' || th === 'dark') applyTheme(th);
  render(); save();
});
setInterval(render, 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) render(); });
})();
</script>
</body>
</html>
